<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLAMA CHAT</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0a0a;
        --surface: #111111;
        --surface2: #1a1a1a;
        --border: #2a2a2a;
        --accent: #c8f542;
        --accent2: #42f5a7;
        --text: #e8e8e8;
        --muted: #666;
        --user-bubble: #1e2a10;
        --ai-bubble: #141414;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        overflow: hidden;
      }

      /* Subtle grid background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(200, 245, 66, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200, 245, 66, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      #app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 860px;
        margin: 0 auto;
      }

      /* Header */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(10px);
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-mark {
        width: 32px;
        height: 32px;
        background: var(--accent);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 14px;
        color: #0a0a0a;
      }

      .title {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .model-badge {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 1px;
      }

      .status-dot {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent2);
        box-shadow: 0 0 6px var(--accent2);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* Chat area */
      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        scroll-behavior: smooth;
      }

      #chat-box::-webkit-scrollbar {
        width: 4px;
      }
      #chat-box::-webkit-scrollbar-track {
        background: transparent;
      }
      #chat-box::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      /* Empty state */
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }

      .empty-icon {
        font-size: 40px;
        opacity: 0.3;
        margin-bottom: 8px;
      }

      .empty-state h2 {
        font-family: "Syne", sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #333;
      }

      .empty-state p {
        font-size: 12px;
        line-height: 1.6;
        max-width: 280px;
      }

      /* Messages */
      .message {
        display: flex;
        flex-direction: column;
        gap: 6px;
        animation: fadeSlideIn 0.25s ease forwards;
      }

      @keyframes fadeSlideIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        align-items: flex-end;
      }
      .message.ai {
        align-items: flex-start;
      }

      .msg-meta {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .msg-meta .role {
        color: var(--accent);
        font-weight: 600;
      }

      .message.ai .msg-meta .role {
        color: var(--accent2);
      }

      .bubble {
        max-width: 75%;
        padding: 14px 18px;
        border-radius: 2px;
        font-size: 13.5px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user .bubble {
        background: var(--user-bubble);
        border: 1px solid rgba(200, 245, 66, 0.2);
        border-radius: 12px 12px 2px 12px;
        color: #d4f080;
      }

      .message.ai .bubble {
        background: var(--ai-bubble);
        border: 1px solid var(--border);
        border-radius: 2px 12px 12px 12px;
        color: var(--text);
      }

      /* Cursor blink for streaming */
      .cursor {
        display: inline-block;
        width: 8px;
        height: 14px;
        background: var(--accent2);
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 0.7s step-end infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Input area */
      .input-area {
        padding: 16px 24px 20px;
        border-top: 1px solid var(--border);
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(10px);
      }

      .input-wrapper {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        transition: border-color 0.2s;
      }

      .input-wrapper:focus-within {
        border-color: rgba(200, 245, 66, 0.4);
        box-shadow: 0 0 0 3px rgba(200, 245, 66, 0.06);
      }

      #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        line-height: 1.5;
        resize: none;
        max-height: 140px;
        min-height: 22px;
        overflow-y: auto;
      }

      #input::placeholder {
        color: var(--muted);
      }

      #input::-webkit-scrollbar {
        width: 3px;
      }
      #input::-webkit-scrollbar-thumb {
        background: var(--border);
      }

      #send-btn {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }

      #send-btn:hover {
        background: #d8ff55;
        transform: scale(1.05);
      }
      #send-btn:active {
        transform: scale(0.97);
      }
      #send-btn:disabled {
        background: var(--surface2);
        cursor: not-allowed;
        transform: none;
      }

      #send-btn svg {
        width: 15px;
        height: 15px;
        fill: #0a0a0a;
      }
      #send-btn:disabled svg {
        fill: var(--muted);
      }

      .input-hint {
        font-size: 10px;
        color: var(--muted);
        margin-top: 8px;
        padding: 0 2px;
        letter-spacing: 0.05em;
      }

      /* Thinking indicator */
      .thinking {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 12px 18px;
        background: var(--ai-bubble);
        border: 1px solid var(--border);
        border-radius: 2px 12px 12px 12px;
        width: fit-content;
      }

      .thinking span {
        width: 6px;
        height: 6px;
        background: var(--accent2);
        border-radius: 50%;
        animation: bounce 1.2s ease-in-out infinite;
      }

      .thinking span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .thinking span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-left">
          <div class="logo-mark">L</div>
          <div>
            <div class="title">Llama Chat</div>
            <div class="model-badge">llama3.2:latest · local</div>
          </div>
        </div>
        <div class="status-dot">
          <div class="dot"></div>
          <span>running</span>
        </div>
      </header>

      <div id="chat-box">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">◈</div>
          <h2>Start a conversation</h2>
          <p>
            Running locally via Ollama. Your data never leaves this machine.
          </p>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="input"
            rows="1"
            placeholder="Type a message..."
            autocomplete="off"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
            </svg>
          </button>
        </div>
        <div class="input-hint">
          Enter to send &nbsp;·&nbsp; Shift+Enter for new line
        </div>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById("chat-box");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send-btn");
      const emptyState = document.getElementById("empty-state");
      let isStreaming = false;

      // Auto-resize textarea
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 140) + "px";
      });

      // Enter to send, Shift+Enter for newline
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function getTime() {
        return new Date().toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        });
      }

      function appendMessage(role, text = "") {
        if (emptyState) emptyState.style.display = "none";

        const msg = document.createElement("div");
        msg.className = `message ${role}`;

        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.innerHTML = `<span class="role">${role === "user" ? "you" : "llama"}</span><span>${getTime()}</span>`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        msg.appendChild(meta);
        msg.appendChild(bubble);
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;

        return bubble;
      }

      function appendThinking() {
        if (emptyState) emptyState.style.display = "none";

        const msg = document.createElement("div");
        msg.className = "message ai";
        msg.id = "thinking-msg";

        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.innerHTML = `<span class="role">llama</span><span>${getTime()}</span>`;

        const thinking = document.createElement("div");
        thinking.className = "thinking";
        thinking.innerHTML = `<span></span><span></span><span></span>`;

        msg.appendChild(meta);
        msg.appendChild(thinking);
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msg;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text || isStreaming) return;

        isStreaming = true;
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";

        // User bubble
        appendMessage("user", text);

        // Thinking indicator
        const thinkingEl = appendThinking();

        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });

          // Replace thinking with real AI bubble
          thinkingEl.remove();
          const aiBubble = appendMessage("ai", "");

          // Add blinking cursor
          const cursor = document.createElement("span");
          cursor.className = "cursor";
          aiBubble.appendChild(cursor);

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let fullText = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                const token = line.slice(6); // remove "data: "
                fullText += token;
                aiBubble.textContent = fullText;
                aiBubble.appendChild(cursor); // re-attach cursor
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }

          // Remove cursor when done
          cursor.remove();
        } catch (err) {
          thinkingEl?.remove();
          appendMessage("ai", "⚠ Connection error. Is Ollama running?");
          console.error(err);
        }

        isStreaming = false;
        sendBtn.disabled = false;
        input.focus();
      }
    </script>
  </body>
</html>
